version: '3.8'

# ParkEazy Local Development Infrastructure (Planned for future phases)
# Note: Part 00 is a scaffold. Databases and caches are not required for Part 00.

services:
  postgres:
    image: postgres:16-alpine
    container_name: parkeazy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: parkeazy_user
      POSTGRES_PASSWORD: parkeazy_password
      POSTGRES_DB: parkeazy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: parkeazy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
