# ==============================================================================
# ParkEazy Production Gateway — Provider-Neutral Nginx Configuration
# ==============================================================================
# Routes:
#   /         -> Customer Website SPA (apps/website/dist)
#   /host/    -> Host Operations Portal SPA (apps/host/dist)
#   /admin/   -> Platform Administration Panel SPA (apps/admin/dist)
#   /api/v1/  -> NestJS REST Backend API (http://api:4000/api/v1/)
#   /health   -> NestJS Health Endpoint (http://api:4000/health)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression for SPA assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstream NestJS Backend API Service
    upstream backend_api {
        server localhost:4000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ----------------------------------------------------------------------
        # 1. API Route Separation (STRICT: Never fallback to index.html)
        # ----------------------------------------------------------------------
        location /api/v1/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location = /health {
            proxy_pass http://backend_api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        # ----------------------------------------------------------------------
        # 2. Host Operations Portal (/host/ -> apps/host/dist)
        # ----------------------------------------------------------------------
        # Normalize /host to /host/
        location = /host {
            return 301 /host/;
        }

        location /host/ {
            alias /var/www/parkeazy/host/;
            index index.html;
            try_files $uri $uri/ /host/index.html;

            # Cache static hashed assets
            location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }

        # ----------------------------------------------------------------------
        # 3. Platform Administration Panel (/admin/ -> apps/admin/dist)
        # ----------------------------------------------------------------------
        # Normalize /admin to /admin/
        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            alias /var/www/parkeazy/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;

            # Cache static hashed assets
            location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }

        # ----------------------------------------------------------------------
        # 4. Customer Website Marketplace (/ -> apps/website/dist)
        # ----------------------------------------------------------------------
        location / {
            root /var/www/parkeazy/website;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache static hashed assets
            location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }
    }
}
